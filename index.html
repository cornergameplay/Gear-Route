<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業路徑製作器 (頂級質感毛玻璃版)</title>
    <!-- 引入 Leaflet 地圖套件 CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* 淺青藍色漸層流動背景 */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
            background-attachment: fixed;
            color: #2c3e50; 
            overflow-x: hidden;
        }
        
        .container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; height: 90vh; }
        
        /* 毛玻璃半透明面板 */
        .panel { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1); 
            display: flex; 
            flex-direction: column; 
            overflow-y: auto; 
        }
        .left-panel { flex: 1; min-width: 420px; z-index: 1000; }
        .right-panel { flex: 2; display: flex; flex-direction: column; position: relative; }
        
        #map { flex: 1; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.8); background: #e5e3df; min-height: 400px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); }
        
        textarea { 
            width: 100%; min-height: 150px; resize: vertical; margin-bottom: 10px; padding: 12px; 
            box-sizing: border-box; font-family: monospace; 
            border: 1px solid rgba(255,255,255,0.8); border-radius: 6px; 
            background: rgba(255,255,255,0.6); outline: none;
        }
        textarea:focus { background: rgba(255,255,255,0.8); border-color: #009688; }
        
        input[type="number"], input[type="text"], select { 
            padding: 8px; border: 1px solid rgba(255,255,255,0.8); border-radius: 6px; box-sizing: border-box; 
            background: rgba(255,255,255,0.6); outline: none;
        }
        input[type="number"]:focus, input[type="text"]:focus, select:focus { background: rgba(255,255,255,0.8); border-color: #009688; }
        
        input[type="number"], input[type="text"] { width: 100%; }
        
        .row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .row > div { flex: 1; }
        
        /* 半透明質感按鈕 */
        button { 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 10px 15px; cursor: pointer; border-radius: 6px; font-weight: bold; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); border-color: rgba(255, 255, 255, 0.8); }
        button:active { transform: translateY(0); }
        
        .btn-primary { background-color: rgba(0, 150, 136, 0.75); color: #fff; }
        .btn-secondary { background-color: rgba(2, 136, 209, 0.75); color: #fff; }
        .btn-danger { background-color: rgba(229, 57, 53, 0.75); color: #fff; }
        .btn-warning { background-color: rgba(245, 124, 0, 0.8); color: #fff; }
        .btn-purple { background-color: rgba(142, 36, 170, 0.75); color: #fff; }
        
        /* 內層設定區塊 */
        .settings-box { 
            border: 1px solid rgba(255, 255, 255, 0.5); 
            padding: 15px; border-radius: 8px; 
            background: rgba(255, 255, 255, 0.35); 
            margin-bottom: 15px; 
        }
        
        /* 資訊列 */
        .info-bar { 
            display: flex; gap: 20px; 
            background: rgba(0, 96, 100, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; flex-wrap: wrap; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .info-bar div { font-size: 1.1em; flex: 1; text-align: center; }
        .info-bar span { font-weight: bold; color: #b2ebf2; font-size: 1.2em; display: block; margin-top: 4px; }
        
        .radius-inputs { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .radius-row { display: flex; align-items: center; gap: 10px; }
        .radius-row label { width: 55px; font-weight: bold; flex-shrink: 0; color: #006064; }
        .radius-row input[type="number"] { width: 80px; flex-shrink: 0; }
        .radius-row select { flex: 1; }
        
        hr { border: 0; border-top: 1px solid rgba(0, 96, 100, 0.15); margin: 15px 0; }
        h2 { color: #006064; margin-top: 0; margin-bottom: 20px; font-weight: 800; text-shadow: 1px 1px 2px rgba(255,255,255,0.6); }
        label b { color: #00838f; }

        /* ====== 地圖右下角快捷按鈕 ====== */
        .custom-map-buttons { display: flex; flex-direction: column; gap: 10px; border: none !important; background: transparent !important; box-shadow: none !important; margin-right: 15px !important; margin-bottom: 15px !important; }
        .custom-map-buttons button { 
            width: 48px; height: 48px; border-radius: 50%; font-size: 1.4em;
            background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); 
            border: 1px solid rgba(255,255,255,0.9);
            display: flex; align-items: center; justify-content: center; padding: 0; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); color: #333;
            text-shadow: none;
        }
        .custom-map-buttons button:hover { background: rgba(255,255,255,1); transform: scale(1.1); }

        /* ====== 手機端 UI 隱藏元素 ====== */
        #mobile-toggle-btn, #mobile-overlay { display: none; }

        /* ====== 手機端響應式設計 (小於 992px) ====== */
        @media (max-width: 992px) {
            body { padding: 0; height: 100vh; overflow: hidden; }
            .container { flex-direction: column; height: 100vh; gap: 0; margin: 0; }
            
            .right-panel { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; padding: 0; background: none; border: none; z-index: 1; border-radius: 0; }
            #map { height: 100vh; border-radius: 0; border: none; }
            
            .left-panel {
                position: fixed; top: 0; left: -100%; width: 85%; max-width: 400px; height: 100vh;
                border-radius: 0 20px 20px 0; border-left: none; border-top: none; border-bottom: none;
                background: rgba(255, 255, 255, 0.85); 
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .left-panel.open { left: 0; }
            
            #mobile-toggle-btn {
                display: block; position: fixed; top: 15px; right: 15px; z-index: 1002;
                background-color: rgba(0, 96, 100, 0.85); color: white;
                border-radius: 30px; padding: 10px 20px; font-size: 1em; border: 1px solid rgba(255,255,255,0.5);
                box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            }
            
            #mobile-overlay {
                display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.5); z-index: 999; backdrop-filter: blur(2px);
            }
            #mobile-overlay.open { display: block; }

            .info-bar {
                position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%;
                z-index: 900; margin: 0; padding: 10px 15px; /* z-index 調低避免擋住地圖控制項 */
                display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
                border-radius: 12px; pointer-events: none; /* 讓點擊穿透 */
            }
            .info-bar div { font-size: 0.9em; margin: 0; text-align: center; }
            .info-bar span { display: inline-block; margin-left: 0; font-size: 1.1em; }
            
            /* 手機版快捷按鈕往上挪，避免被資訊列擋住 */
            .custom-map-buttons { margin-bottom: 130px !important; }
        }
    </style>
</head>
<body>

<!-- 手機版懸浮按鈕與遮罩 -->
<button id="mobile-toggle-btn" onclick="toggleSettings()">⚙️ 設定面板</button>
<div id="mobile-overlay" onclick="toggleSettings()"></div>

<div class="container">
    <!-- 左側控制面板 (手機版為側滑抽屜) -->
    <!-- 移除 onClick 自動收合的邏輯，只有按下遮罩或設定按鈕才會收合 -->
    <div class="panel left-panel" id="settings-drawer">
        <h2>路徑製作器</h2>
        
        <div class="settings-box">
            <label><b>1. 座標輸入</b></label>
            <textarea id="coord-input" placeholder="貼上座標，一行一組 (緯度, 經度)&#10;例如:&#10;25.0339, 121.5645&#10;25.0478, 121.5318"></textarea>
            
            <div style="margin-bottom: 10px;">
                <input type="file" id="gpx-file" accept=".gpx" style="font-size: 0.9em;">
            </div>
            <div class="row">
                <button class="btn-secondary" onclick="loadCoordinates()">載入座標</button>
                <button class="btn-danger" onclick="clearAll()">清除座標</button>
            </div>
        </div>

        <div class="settings-box">
            <label><b>2. 路徑資料設定</b></label>
            <div class="row" style="margin-top: 10px;">
                <div>
                    <label>總繞圈數:</label>
                    <input type="number" id="laps-input" value="1" min="1" max="20" onchange="generateRadiusInputs()">
                </div>
                <div>
                    <label>時速 (Km/h):</label>
                    <input type="number" id="speed-input" value="5.0" step="0.1" min="0.1" onchange="recalculateTime()">
                </div>
            </div>
            <label>各圈半徑與繞行模式設定:</label>
            <div id="radius-container" class="radius-inputs">
                <!-- Javascript 動態生成 -->
            </div>
        </div>

        <div class="settings-box">
            <label><b>3. 檔名與地理位置</b></label>
            <div class="row" style="margin-top: 10px;">
                <div style="flex: 2;">
                    <input type="text" id="filename-input" placeholder="檔案名稱 (將作為 GPX 下載檔名)">
                </div>
            </div>
            <div class="row">
                <button class="btn-warning" onclick="analyzeFirstCoordinate()">🔍 判斷座標生成檔名</button>
                <button class="btn-primary" id="apply-filename-btn" style="display:none;" onclick="applyGeneratedFilename()">套用檔名</button>
            </div>
            <div id="geo-preview" style="font-size: 0.85em; color: #006064; margin-top: 5px; font-weight: bold;"></div>
        </div>

        <hr>
        <div class="row">
            <button class="btn-purple" onclick="optimizeRoute()" style="font-size: 1.1em; padding: 12px;">最佳化路徑</button>
            <button class="btn-primary" onclick="downloadGPX()" style="font-size: 1.1em; padding: 12px;">下載GPX檔案</button>
        </div>
    </div>

    <!-- 右側地圖與資訊面板 -->
    <div class="panel right-panel">
        <div class="info-bar">
            <div>座標總數：<br><span id="info-count">0</span></div>
            <div>繞行點位：<br><span id="info-wpt-count">0</span></div>
            <div>總里程：<br><span id="info-dist">0.00</span> Km</div>
            <div>預估時間：<br><span id="info-time">00分00秒</span></div>
        </div>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let map;
    let pathLayer = null;
    let markersLayer = null;
    let finalWptPath = []; 
    let tempGeneratedFilename = ""; 
    let originalImportedFilename = ""; 
    
    let originalBaseCoords = []; // 用於記錄使用者最一開始匯入的原順序
    let currentBaseCoords = [];  // 用於記錄當前的順序(原順序或最佳化後)

    window.onload = function() {
        map = L.map('map').setView([25.0339, 121.5645], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 新增 Leaflet 自訂控制項 (右下角三個無字圖示按鈕)
        const CustomControl = L.Control.extend({
            options: { position: 'bottomright' },
            onAdd: function () {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control custom-map-buttons');
                container.innerHTML = `
                    <button title="畫面滿版" onclick="fitMapBounds()">🔍</button>
                    <button title="復原原始路徑" onclick="restoreOriginalRoute()">↩️</button>
                    <button title="最佳化路徑" onclick="optimizeRoute()">✨</button>
                `;
                L.DomEvent.disableClickPropagation(container);
                return container;
            }
        });
        map.addControl(new CustomControl());

        generateRadiusInputs();
        document.getElementById('gpx-file').addEventListener('change', handleFileUpload);

        // 如果是手機版，預設打開設定抽屜
        if (window.innerWidth <= 992) {
            document.getElementById('settings-drawer').classList.add('open');
            document.getElementById('mobile-overlay').classList.add('open');
        }
    };

    function toggleSettings() {
        const drawer = document.getElementById('settings-drawer');
        const overlay = document.getElementById('mobile-overlay');
        drawer.classList.toggle('open');
        overlay.classList.toggle('open');
    }

    function generateRadiusInputs() {
        const container = document.getElementById('radius-container');
        const laps = parseInt(document.getElementById('laps-input').value) || 1;
        
        const oldRadii = [];
        const oldModes = [];
        container.querySelectorAll('input[type="number"]').forEach(inp => oldRadii.push(inp.value));
        container.querySelectorAll('select').forEach(sel => oldModes.push(sel.value));

        container.innerHTML = '';
        for (let i = 1; i <= laps; i++) {
            const div = document.createElement('div');
            div.className = 'radius-row';
            const rVal = oldRadii[i-1] || '33.0'; 
            const mVal = oldModes[i-1] || 'oct';
            
            div.innerHTML = `
                <label>第 ${i} 圈:</label> 
                <input type="number" id="radius-${i}" value="${rVal}" step="0.1" min="6" onchange="if(currentBaseCoords.length>0) drawRoute()">
                <select id="mode-${i}" onchange="if(currentBaseCoords.length>0) drawRoute()">
                    <option value="oct" ${mVal === 'oct' ? 'selected' : ''}>繞圈模式</option>
                    <option value="zig" ${mVal === 'zig' ? 'selected' : ''}>鋸齒模式</option>
                </select>
            `;
            container.appendChild(div);
        }
        if (currentBaseCoords.length > 0) drawRoute(); 
    }

    function clearAll() {
        document.getElementById('coord-input').value = '';
        document.getElementById('gpx-file').value = '';
        document.getElementById('filename-input').value = '';
        document.getElementById('geo-preview').innerText = '';
        document.getElementById('apply-filename-btn').style.display = 'none';
        document.getElementById('info-count').innerText = '0';
        document.getElementById('info-wpt-count').innerText = '0';
        document.getElementById('info-dist').innerText = '0.00';
        document.getElementById('info-time').innerText = '00分00秒';
        if (pathLayer) map.removeLayer(pathLayer);
        if (markersLayer) map.removeLayer(markersLayer);
        finalWptPath = [];
        currentBaseCoords = [];
        originalBaseCoords = [];
        tempGeneratedFilename = "";
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        originalImportedFilename = file.name.replace(/\.gpx$/i, '');
        document.getElementById('filename-input').value = originalImportedFilename;

        const reader = new FileReader();
        reader.onload = function(evt) {
            const text = evt.target.result;
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, "text/xml");
            const points = [...xmlDoc.querySelectorAll('wpt, trkpt, rtept')];
            if (points.length === 0) {
                alert("在此檔案中找不到任何座標點！");
                return;
            }
            let coordString = points.map(p => `${p.getAttribute('lat')}, ${p.getAttribute('lon')}`).join('\n');
            document.getElementById('coord-input').value = coordString;
        };
        reader.readAsText(file);
    }

    function parseCoordinates() {
        const text = document.getElementById('coord-input').value;
        const lines = text.split('\n');
        const coords = [];
        for (const line of lines) {
            const cleanLine = line.trim();
            if (!cleanLine) continue;
            const parts = cleanLine.split(/[\s,]+/);
            if (parts.length >= 2) {
                const lat = parseFloat(parts[0]);
                const lon = parseFloat(parts[1]);
                if (!isNaN(lat) && !isNaN(lon)) coords.push({ lat, lon });
            }
        }
        return coords;
    }

    async function analyzeFirstCoordinate() {
        const coords = parseCoordinates();
        if (coords.length === 0) {
            alert("請先輸入座標！");
            return;
        }
        const first = coords[0];
        const laps = parseInt(document.getElementById('laps-input').value) || 1;
        const preview = document.getElementById('geo-preview');
        
        preview.innerText = "🔍 正在查詢資訊，請稍候...";
        document.getElementById('apply-filename-btn').style.display = 'none';

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${first.lat}&lon=${first.lon}&zoom=10&addressdetails=1&accept-language=en`);
            const data = await res.json();
            
            let countryCode = data.address?.country_code?.toUpperCase();
            let country = '未知國家';
            if (countryCode) {
                try {
                    const regionNamesInZhHant = new Intl.DisplayNames(['zh-Hant-TW'], { type: 'region' });
                    country = regionNamesInZhHant.of(countryCode);
                } catch(e) {
                    country = data.address?.country || '未知國家';
                }
            }
            
            const city = data.address?.city || data.address?.town || data.address?.county || data.address?.state || 'UnknownCity';

            const resTz = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${first.lat}&longitude=${first.lon}&current_weather=true&timezone=auto`);
            const dataTz = await resTz.json();
            
            let timeDiffStr = "+0";
            if (dataTz.utc_offset_seconds !== undefined) {
                const taiwanOffsetHours = 8; 
                const localOffsetHours = dataTz.utc_offset_seconds / 3600;
                const diffHours = taiwanOffsetHours - localOffsetHours;
                
                if (diffHours > 0) timeDiffStr = `+${diffHours}`;
                else if (diffHours < 0) timeDiffStr = `${diffHours}`; 
                else timeDiffStr = "+0";
            }

            const cleanCity = city.replace(/\s+/g, '');
            tempGeneratedFilename = `${country}_${cleanCity}_${timeDiffStr}小時_${coords.length}組_${laps}圈`;
            
            preview.innerText = `✅ 建議檔名：${tempGeneratedFilename}`;
            document.getElementById('apply-filename-btn').style.display = 'inline-block';
        } catch (error) {
            console.error(error);
            preview.innerText = "❌ 查詢失敗，請檢查網路狀態。";
        }
    }

    function applyGeneratedFilename() {
        if (tempGeneratedFilename) {
            document.getElementById('filename-input').value = tempGeneratedFilename;
        }
    }

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function loadCoordinates() {
        const coords = parseCoordinates();
        if (coords.length === 0) {
            alert("請輸入有效的座標！");
            return;
        }
        // 記錄最原始的輸入資料，用於復原功能
        originalBaseCoords = [...coords];
        currentBaseCoords = [...coords];
        drawRoute();
    }

    function restoreOriginalRoute() {
        if (originalBaseCoords.length === 0) {
            alert("您還沒有載入任何座標！");
            return;
        }
        currentBaseCoords = [...originalBaseCoords];
        drawRoute();
    }

    function fitMapBounds() {
        if (pathLayer && finalWptPath.length > 0) {
            map.fitBounds(pathLayer.getBounds(), {padding: [30, 30]});
        }
    }

    function optimizeRoute() {
        if (currentBaseCoords.length === 0) {
            alert("請先「載入座標」再進行最佳化！");
            return;
        }
        let coords = [...currentBaseCoords];
        let routeIndices = [];
        if (coords.length <= 1) {
            routeIndices = [0];
        } else {
            let unvisited = new Set(Array.from({length: coords.length}, (_, i) => i));
            let curr = 0; 
            routeIndices.push(curr);
            unvisited.delete(curr);

            while(unvisited.size > 0) {
                let nearest = -1;
                let minDist = Infinity;
                for (let j of unvisited) {
                    let d = getDistance(coords[curr].lat, coords[curr].lon, coords[j].lat, coords[j].lon);
                    if (d < minDist) {
                        minDist = d;
                        nearest = j;
                    }
                }
                curr = nearest;
                routeIndices.push(curr);
                unvisited.delete(curr);
            }

            let improved = true;
            let maxIterations = 50; 
            while (improved && maxIterations > 0) {
                improved = false;
                maxIterations--;
                for (let i = 0; i < routeIndices.length - 2; i++) {
                    for (let j = i + 2; j < routeIndices.length - 1; j++) {
                        let a = routeIndices[i], b = routeIndices[i+1];
                        let c = routeIndices[j], d = routeIndices[j+1];
                        let distOld = getDistance(coords[a].lat, coords[a].lon, coords[b].lat, coords[b].lon) + 
                                      getDistance(coords[c].lat, coords[c].lon, coords[d].lat, coords[d].lon);
                        let distNew = getDistance(coords[a].lat, coords[a].lon, coords[c].lat, coords[c].lon) + 
                                      getDistance(coords[b].lat, coords[b].lon, coords[d].lat, coords[d].lon);
                        if (distNew < distOld - 0.0001) {
                            let subArray = routeIndices.slice(i+1, j+1).reverse();
                            for(let k = 0; k < subArray.length; k++){
                                routeIndices[i + 1 + k] = subArray[k];
                            }
                            improved = true;
                        }
                    }
                }
            }
        }
        currentBaseCoords = routeIndices.map(i => coords[i]);
        drawRoute();
    }

    function drawRoute() {
        if (currentBaseCoords.length === 0) return;
        document.getElementById('info-count').innerText = currentBaseCoords.length;

        const laps = parseInt(document.getElementById('laps-input').value) || 1;
        finalWptPath = [];
        
        function getVertex(centerLat, centerLon, radiusMeters, angleDeg) {
            const mPerLat = 111320; 
            const mPerLon = 111320 * Math.cos(centerLat * Math.PI / 180);
            const rad = angleDeg * Math.PI / 180;
            const dx = radiusMeters * Math.sin(rad);
            const dy = radiusMeters * Math.cos(rad);
            return { lat: centerLat + (dy / mPerLat), lon: centerLon + (dx / mPerLon) };
        }

        let currentPos = null; 

        currentBaseCoords.forEach((center) => {
            let entryAngleDeg = 0; 
            
            let mode1 = document.getElementById('mode-1') ? document.getElementById('mode-1').value : 'oct';
            let r1 = document.getElementById('radius-1') ? (parseFloat(document.getElementById('radius-1').value) || 33.0) : 33.0;

            if (currentPos) {
                let minDist = Infinity;
                let possibleAngles = [];
                
                if (mode1 === 'oct') {
                    for(let i=0; i<8; i++) possibleAngles.push(i * 45);
                } else {
                    for(let i=0; i<24; i++) possibleAngles.push(i * 15);
                }

                possibleAngles.forEach(ang => {
                    let actualR = (mode1 === 'oct') ? (r1 / Math.cos(22.5 * Math.PI / 180)) : (r1 + 2);
                    let v = getVertex(center.lat, center.lon, actualR, ang);
                    let d = getDistance(currentPos.lat, currentPos.lon, v.lat, v.lon);
                    if (d < minDist) {
                        minDist = d;
                        entryAngleDeg = ang;
                    }
                });
            }

            for (let lap = 1; lap <= laps; lap++) {
                let mode = document.getElementById(`mode-${lap}`).value;
                let baseR = parseFloat(document.getElementById(`radius-${lap}`).value) || 33.0;

                if (mode === 'oct') {
                    let actualR = baseR / Math.cos(22.5 * Math.PI / 180);
                    for (let step = 0; step <= 8; step++) {
                        let ang = entryAngleDeg + step * 45;
                        let v = getVertex(center.lat, center.lon, actualR, ang);
                        finalWptPath.push(v);
                        currentPos = v;
                    }
                } else {
                    let outerR = baseR + 2;
                    let innerR = Math.max(1, baseR - 8); 
                    
                    for (let step = 0; step < 24; step++) {
                        let angOut = entryAngleDeg + step * 15;
                        let vOut = getVertex(center.lat, center.lon, outerR, angOut);
                        finalWptPath.push(vOut);
                        currentPos = vOut;

                        let angIn = angOut + 7.5;
                        let vIn = getVertex(center.lat, center.lon, innerR, angIn);
                        finalWptPath.push(vIn);
                        currentPos = vIn;
                    }

                    if (lap === laps) {
                        for (let step = 0; step <= 2; step++) {
                            let angOut = entryAngleDeg + step * 15;
                            let vOut = getVertex(center.lat, center.lon, outerR, angOut);
                            finalWptPath.push(vOut);
                            currentPos = vOut;

                            let angIn = angOut + 7.5;
                            let vIn = getVertex(center.lat, center.lon, innerR, angIn);
                            finalWptPath.push(vIn);
                            currentPos = vIn; 
                        }
                    } else {
                        let angOut = entryAngleDeg;
                        let vOut = getVertex(center.lat, center.lon, outerR, angOut);
                        finalWptPath.push(vOut);
                        currentPos = vOut;
                    }
                }
            }
        });

        recalculateTime();

        if (pathLayer) map.removeLayer(pathLayer);
        if (markersLayer) map.removeLayer(markersLayer);

        let latlngs = finalWptPath.map(p => [p.lat, p.lon]);
        pathLayer = L.polyline(latlngs, {color: '#e53935', weight: 1.5}).addTo(map);
        
        markersLayer = L.layerGroup();
        finalWptPath.forEach(p => {
            L.circleMarker([p.lat, p.lon], {radius: 1.5, color: '#0288d1', fillColor: '#0288d1', fillOpacity: 1}).addTo(markersLayer);
        });
        markersLayer.addTo(map);

        fitMapBounds(); // 繪製完成後自動縮放滿版
    }

    function recalculateTime() {
        if (finalWptPath.length === 0) return;
        
        let totalDistKm = 0;
        for (let i = 0; i < finalWptPath.length - 1; i++) {
            totalDistKm += getDistance(finalWptPath[i].lat, finalWptPath[i].lon, finalWptPath[i+1].lat, finalWptPath[i+1].lon);
        }
        
        const speedKmH = parseFloat(document.getElementById('speed-input').value) || 5.0;
        const timeHours = totalDistKm / speedKmH;
        const totalMinutes = Math.floor(timeHours * 60);
        const totalSeconds = Math.round((timeHours * 60 - totalMinutes) * 60);

        document.getElementById('info-wpt-count').innerText = finalWptPath.length;
        document.getElementById('info-dist').innerText = totalDistKm.toFixed(2);
        
        let minStr = totalMinutes.toString().padStart(2, '0');
        let secStr = totalSeconds.toString().padStart(2, '0');
        document.getElementById('info-time').innerText = `${minStr}分${secStr}秒`;
    }

    function downloadGPX() {
        if (finalWptPath.length === 0) {
            alert("請先載入座標或最佳化產生路徑！");
            return;
        }

        let filename = document.getElementById('filename-input').value.trim();
        if (!filename) filename = "Route";

        let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
        gpx += `<gpx version="1.1" creator="Professional Route Builder">\n`;
        
        finalWptPath.forEach((pt, index) => {
            gpx += `  <wpt lat="${pt.lat.toFixed(6)}" lon="${pt.lon.toFixed(6)}">\n`;
            gpx += `    <name>Point_${index+1}</name>\n`;
            gpx += `  </wpt>\n`;
        });
        
        gpx += `</gpx>`;

        const blob = new Blob([gpx], { type: 'application/gpx+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${filename}.gpx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
